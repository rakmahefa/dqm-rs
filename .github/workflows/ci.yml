name: CI

on:
  push:
    branches: [main, feat/offline-app]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  verify-data:
    name: Verify committed game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data/*.json + assets/sprites.json
        run: python3 scripts/verify_data.py

  build-linux:
    name: Linux x86_64 (tar.gz + .deb + AppImage)
    runs-on: ubuntu-latest
    needs: verify-data
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dx CLI (Dioxus 0.7.10)
        run: |
          curl -sL https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
          find . -maxdepth 2 -name dx -type f -exec sudo install -m 755 {} /usr/local/bin/dx \;
          dx --version

      - name: Generate bundle icon
        run: |
          python3 scripts/gen_icon.py
          python3 - <<'EOF'
          import struct
          d = open("assets/icon.png", "rb").read()
          assert d[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          w, h = struct.unpack(">II", d[16:24])
          assert (w, h) == (512, 512), f"bad icon dims {w}x{h}"
          print("icon OK:", len(d), "bytes")
          EOF

      - name: Build release binary
        run: dx build --release

      - name: Package tar.gz
        run: |
          mkdir -p dist
          BIN="$(find target -type f -name dqm-rs -perm -u+x | head -n1)"
          test -n "$BIN"
          cp "$BIN" dist/dqm-rs
          cp README.md dist/README.md
          tar -czf dist/dqm-rs-linux-x86_64.tar.gz -C dist dqm-rs README.md
          sha256sum dist/dqm-rs-linux-x86_64.tar.gz

      - name: Bundle .deb
        run: dx bundle --release --package-types deb

      - name: Bundle AppImage
        run: dx bundle --release --package-types appimage
        continue-on-error: true

      - name: Collect bundles
        run: |
          mkdir -p bundles
          find target -type f -name '*.deb' -exec cp {} bundles/ \; || true
          find target -type f -name '*.AppImage' -exec cp {} bundles/ \; || true
          ls -la bundles/

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: dqm-rs-linux-x86_64
          path: dist/dqm-rs-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dqm-rs-linux-amd64-deb
          path: bundles/*.deb
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: dqm-rs-linux-x86_64-AppImage
          path: bundles/*.AppImage
          if-no-files-found: ignore

  build-android:
    name: Android arm64-v8a (APK)
    runs-on: ubuntu-latest
    needs: verify-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dx CLI (Dioxus 0.7.10)
        run: |
          curl -sL https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
          find . -maxdepth 2 -name dx -type f -exec sudo install -m 755 {} /usr/local/bin/dx \;
          dx --version

      - name: Configure Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            yes | sdkmanager "ndk;27.0.12077973" >/dev/null
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
            echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          fi

      - name: Build APK (release, arm64-v8a)
        run: dx build --platform android --release --no-default-features --features mobile --target aarch64-linux-android

      - name: Sign APK (temporary CI keystore)
        run: |
          set -euo pipefail
          APK="$(find target/dx -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "No APK found"; exit 1; }
          echo "APK: $APK"

          KEYSTORE_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEYSTORE_DIR"' EXIT
          KEYSTORE="$KEYSTORE_DIR/ci.keystore"
          KEYSTORE_PASSWORD="$(openssl rand -hex 16)"

          # keytool requires passwords of at least six characters.
          # Use an ephemeral PKCS12 keystore; no signing secret is committed.
          keytool -genkeypair -v -storetype PKCS12 -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -alias dqmrs -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=dqm-rs CI, O=rakmahefa, C=FR" -noprompt

          BT="$(dirname "$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)")"
          test -x "$BT/apksigner" || { echo "apksigner not found"; exit 1; }
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias dqmrs --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out dqm-rs-android-arm64-v8a.apk aligned.apk
          "$BT/apksigner" verify --print-certs dqm-rs-android-arm64-v8a.apk
          sha256sum dqm-rs-android-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dqm-rs-android-arm64-v8a
          path: dqm-rs-android-arm64-v8a.apk
          if-no-files-found: error
