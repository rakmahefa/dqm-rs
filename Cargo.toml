[package]
name = "dqm-rs"
version = "0.1.0"
edition = "2021"
description = "100% offline companion app for Dragon Quest Monsters 2 SP (encyclopedia, synthesis planner, eggs)"
repository = "https://github.com/rakmahefa/dqm-rs"
keywords = ["dioxus", "gui", "game-tool", "offline"]
license = "MIT"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[profile.release]
lto = "thin"
codegen-units = 1
